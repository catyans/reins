name: Feature Request
description: Suggest a new feature for Reins
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Why do you need it?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this work? Include code examples if possible.
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Which module does this relate to?
      options:
        - Core
        - Budget
        - Trace
        - Lens
        - Pulse
        - Proxy
        - Adapters
        - CLI
        - New module
    validations:
      required: true
