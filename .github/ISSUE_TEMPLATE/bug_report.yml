name: Bug Report
description: Report a bug in Reins
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      value: |
        1. Install reins with `pip install reins[...]`
        2. Run this code: ...
        3. See error: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Reins version
      description: "Output of `reins version`"
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Which module?
      options:
        - Core
        - Budget
        - Trace
        - Lens
        - Pulse
        - Proxy
        - Adapters (LangChain/OpenAI/CrewAI/OTel)
        - CLI
    validations:
      required: true
