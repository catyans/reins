[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reins"
version = "0.1.0"
description = "Take control of your AI agents — debuggable, affordable, reliable."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Reins Team" },
]
keywords = ["ai", "agents", "llm", "observability", "cost", "budget", "tracing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "duckdb>=1.0.0",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
budget = []
trace = []
lens = ["reins[trace]"]
pulse = []
proxy = ["aiohttp>=3.9"]
# Framework adapters (each is optional)
langchain = []     # No extra deps — uses duck-typing
openai-agents = [] # No extra deps — uses duck-typing
crewai = []        # No extra deps — uses duck-typing
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
all = ["reins[budget]", "reins[trace]", "reins[lens]", "reins[pulse]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff==0.16.9",
]

[project.scripts]
reins = "reins.cli.main:main"

[project.entry-points."reins.modules"]
budget = "reins.budget:BudgetModule"
trace = "reins.trace:TraceModule"
lens = "reins.lens:LensModule"
pulse = "reins.pulse:PulseModule"

[project.urls]
Homepage = "https://github.com/reins-ai/reins"
Documentation = "https://reins.dev"
Repository = "https://github.com/reins-ai/reins"

[tool.hatch.build.targets.wheel]
packages = ["src/reins"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
