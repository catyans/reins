[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reins"
version = "0.2.0"
description = "Quality-constrained policy selection and cost control for AI agent tasks."
readme = "README.md"
license = "BUSL-1.1"
requires-python = ">=3.10"
authors = [
    { name = "Reins Team" },
]
keywords = ["ai", "agents", "llm", "observability", "cost", "budget", "tracing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "duckdb>=1.0.0",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
budget = []
trace = []
lens = ["reins[trace]"]
pulse = []
proxy = ["aiohttp>=3.9"]
# Framework adapters (each is optional)
langchain = []     # No extra deps — uses duck-typing
openai-agents = [] # No extra deps — uses duck-typing
crewai = []        # No extra deps — uses duck-typing
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
all = ["reins[budget]", "reins[trace]", "reins[lens]", "reins[pulse]"]
sdk-test = ["anthropic==1.9.0", "openai==3.20.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
reins = "reins.cli.main:main"

[project.entry-points."reins.modules"]
budget = "reins.budget:BudgetModule"
trace = "reins.trace:TraceModule"
lens = "reins.lens:LensModule"
pulse = "reins.pulse:PulseModule"

[project.urls]
Homepage = "https://github.com/catyans/reins"
Documentation = "https://github.com/catyans/reins/tree/main/docs"
Repository = "https://github.com/catyans/reins"

[tool.hatch.build.targets.wheel]
packages = ["src/reins"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# Preserve the exact pre-registered benchmark fixture text.
"benchmarks/google_workload.py" = ["E501"]
